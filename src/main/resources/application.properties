spring.application.name=permission-service
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
management.endpoint.health.show-details=always
# CORS: origins que aceptan, separados por comas. Sin la variable, ninguno.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# Auth0: se aceptan solo tokens de este tenant (iss) y para esta API (aud).
# Sin las variables, el servicio no arranca. Spring también revisa la firma y
# que el token no esté vencido.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH0_DOMAIN}/
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE}
