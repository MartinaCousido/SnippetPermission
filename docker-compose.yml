# Levanta solo Permission Service y su base de datos.
# Uso: cp .env.example .env && docker compose up --build
#
# El nombre de proyecto es el mismo en todos los compose del sistema: así los
# contenedores y los datos son los mismos se levante un servicio solo o todo.
name: snippet-searcher

services:
  permission-service:
    build: .
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:postgresql://permisos-db:5432/${PERMISOS_DB_NAME:?Falta PERMISOS_DB_NAME, copiá .env.example a .env}
      DB_USER: ${PERMISOS_DB_USER:?Falta PERMISOS_DB_USER, copiá .env.example a .env}
      DB_PASSWORD: ${PERMISOS_DB_PASSWORD:?Falta PERMISOS_DB_PASSWORD, copiá .env.example a .env}
    depends_on:
      permisos-db:
        condition: service_healthy

  permisos-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${PERMISOS_DB_NAME}
      POSTGRES_USER: ${PERMISOS_DB_USER}
      POSTGRES_PASSWORD: ${PERMISOS_DB_PASSWORD}
    ports:
      # Solo accesible desde esta máquina.
      - "127.0.0.1:5434:5432"
    volumes:
      - permisos-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  permisos-data:
